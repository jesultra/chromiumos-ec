description: "BYD DELL JGCCT"
compatible: "byd,jgcct"

include: battery-smart.yaml

properties:
  enum-name:
    type: string
    default: "byd,jgcct"

  # Fuel gauge
  manuf_name:
    default: "BYD"
  device_name:
    default: "DELL JGCCT"
  ship_mode_reg_addr:
    default: 0x00
  ship_mode_reg_data:
    default: [0x0010, 0x0010]
  fet_mfgacc_support:
    default: 1
  fet_mfgacc_smb_block:
    default: 1
  fet_reg_addr:
    default: 0x00
  fet_reg_mask:
    default: 0x2000
  fet_disconnect_val:
    default: 0x2000
  fet_cfet_mask:
    default: 0x0004
  fet_cfet_off_val:
    default: 0x0000

  # Battery info
  voltage_max:
    default: 17400
  voltage_normal:
    default: 15000
  voltage_min:
    default: 12000
  precharge_current:
    default: 256
  start_charging_min_c:
    default: 0
  start_charging_max_c:
    default: 60
  charging_min_c:
    default: 0
  charging_max_c:
    default: 60
  discharging_min_c:
    default: 0
  discharging_max_c:
    default: 70
