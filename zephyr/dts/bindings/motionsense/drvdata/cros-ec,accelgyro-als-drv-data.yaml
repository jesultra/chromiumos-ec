description: ALS driver data

compatible: "cros-ec,accelgyro-als-drv-data"

child-binding:
    description: ALS calibration data
    properties:
        scale:
            type: int
            required: true
            description: Scale, uscale, and offset are used to correct the raw 16 bit ALS data
                         and then to convert it to 32 bit using the following equations
                         raw_value += offset;
                         adjusted_value = raw_value * scale + raw_value * uscale / 10000;
        uscale:
            type: int
            required: true
            description: uscale
        offset:
            type: int
            required: true
            description: offset
