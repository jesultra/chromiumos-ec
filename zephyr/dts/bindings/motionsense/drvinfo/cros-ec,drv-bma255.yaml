description: BMA255 driver node

compatible: "cros-ec,drv-bma255"

include: base.yaml

properties:
    status:
        required: true
    i2c-spi-addr-flags:
        type: string
        required: true
        description: i2c address or SPI slave logic GPIO
        enum:
            - "BMA2x2_I2C_ADDR1_FLAGS"
            - "BMA2x2_I2C_ADDR2_FLAGS"
            - "BMA2x2_I2C_ADDR3_FLAGS"
            - "BMA2x2_I2C_ADDR4_FLAGS"
